<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Health — CORE UI status pattern</title>
  <meta name="color-scheme" content="light dark" />
  <!-- Apply the remembered theme BEFORE first paint: an embedded browser paints the area behind the page in the
       colour it sees at load, so a page that loads light and turns dark later shows a light frame at its edges. -->
  <script>
    (function () { var t = 'Light'; try { t = localStorage.getItem('dh-theme') || t; } catch (e) {}
      var d = t !== 'Light'; var h = document.documentElement;
      h.style.background = d ? '#1a1a1a' : '#f7f7f7'; h.style.colorScheme = d ? 'dark' : 'light';
      h.setAttribute('data-theme', t); })();
  </script>
  <link rel="stylesheet" href="assets/coreui-tokens.css" />
  <link rel="stylesheet" href="assets/coreui-components.css" />
  <link rel="stylesheet" href="assets/coreui-filters-action-bar.css" />
  <link rel="stylesheet" href="assets/coreui-dataviz-bar.css" />
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="data-health.css" />
  <link rel="stylesheet" href="theme-layer.css" />   <!-- EXPERIMENT: swatch rail + experiment palette layer -->
</head>
<body class="Core-Theme--Light">
  <script>(function () { var t = document.documentElement.getAttribute('data-theme'); document.body.className = 'Core-Theme--' + (t === 'Light' ? 'Light' : 'Dark'); document.body.style.background = t === 'Light' ? '#f7f7f7' : '#1a1a1a'; })();</script>
  <div class="dh-page" data-dh="shell">

    <!-- Title row, above the toolbar -->
    <header class="dh-title"><b>Data Health</b><span>CORE UI status pattern · live demo</span></header>

    <!-- Toolbar: CORE UI's own Storybook toolbar markup (.extended-toolbar / .select-container / #theme-switcher) -->
    <div class="extended-toolbar">
      <div class="select-container">
        <select id="theme-switcher" aria-label="Theme">
          <option value="Light" selected>Light Theme</option>
          <option value="Dark">Dark Theme</option>
        </select>
      </div>
      <!-- Carousel between the previews: the preview's name, then CORE UI's own Pagination component (rendered by app.js) -->
      <div class="dh-carousel">
        <div class="dh-carousel-name" id="pname" aria-live="polite"></div>
        <div id="pager"></div>
        <div id="themeRail" class="dh-theme-rail" role="listbox" aria-label="Theme presets (experiment)" data-dh="experiment: swatch rail"></div>
      </div>
      <div class="dh-toolbar-spacer" aria-hidden="true"></div>
    </div>

    <!-- Preview + controls: Epsilon's live-demo layout -->
    <div class="coreui-livedemo dh-livedemo">
      <div class="dh-preview" id="preview">
        <section class="dh-surface" data-surface="table" aria-label="Table">
          <div id="tableMount" data-dh="shell"></div>
        </section>

        <section class="dh-surface" data-surface="tableGroups" aria-label="Table with group headers">
          <div id="tableGroupsMount" data-dh="shell"></div>
        </section>

        <section class="dh-surface" data-surface="card" aria-label="Card">
          <div class="dh-cards" id="cardMount" data-dh="shell"></div>
        </section>

        <section class="dh-surface" data-surface="dash" aria-label="Dashboard Radial">
          <div class="dh-dash" id="dash" data-dh="shell"></div>
        </section>

        <section class="dh-surface" data-surface="dashBar" aria-label="Dashboard Bar">
          <div class="dh-dash" id="dashBar" data-dh="shell"></div>
        </section>
      </div>

      <aside class="coreui-livedemo__controls dh-controls" aria-label="Controls">
        <div class="dh-controls-head">
          <button type="button" class="Core-Button Core-Button--icon-large is-ready" id="resetBtn" title="Reset to defaults" aria-label="Reset to defaults">
            <i class="Core-Icon Core-Icon--undo" aria-hidden="true"></i>
          </button>
        </div>
        <div id="controlsMount"></div>
      </aside>
    </div>

    <!-- Spec readout behind Storybook's own "Show code" row: the code surface opens above the buttons and pushes them down -->
    <div class="dh-code" id="codePanel" hidden data-dh="shell"><div class="dh-code-count" id="codeCount"></div><pre class="dh-spec" id="spec"></pre></div>
    <div class="sbdocs sbdocs-preview-actions dh-code-actions">
      <button type="button" class="docblock-code-toggle" id="codeToggle" aria-expanded="false" aria-controls="codePanel"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M8.982 1.632a.5.5 0 00-.964-.263l-3 11a.5.5 0 10.964.263l3-11zM3.32 3.616a.5.5 0 01.064.704L1.151 7l2.233 2.68a.5.5 0 11-.768.64l-2.5-3a.5.5 0 010-.64l2.5-3a.5.5 0 01.704-.064zM10.68 3.616a.5.5 0 00-.064.704L12.849 7l-2.233 2.68a.5.5 0 00.768.64l2.5-3a.5.5 0 000-.64l-2.5-3a.5.5 0 00-.704-.064z" fill="currentColor"/></svg> <span id="codeToggleText">Show code</span></button>
      <button type="button" class="docblock-code-copy" id="codeCopy"><svg width="14" height="14" viewBox="0 0 14 15" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M11.746.07A.5.5 0 0011.5.003h-6a.5.5 0 00-.5.5v2.5H.5a.5.5 0 00-.5.5v10a.5.5 0 00.5.5h8a.5.5 0 00.5-.5v-2.5h4.5a.5.5 0 00.5-.5v-8a.498.498 0 00-.15-.357L11.857.154a.506.506 0 00-.11-.085zM9 10.003h4v-7h-1.5a.5.5 0 01-.5-.5v-1.5H6v2h.5a.5.5 0 01.357.15L8.85 5.147c.093.09.15.217.15.357v4.5zm-8-6v9h7v-7H6.5a.5.5 0 01-.5-.5v-1.5H1z" fill="currentColor"/></svg> <span id="codeCopyText">Copy code</span></button>
    </div>
    <div class="Core-ToolTip Core-ToolTip-top dh-tip" id="tip" role="tooltip" hidden><span class="tooltipMessage" id="tipText"></span></div>
  </div>

  <script src="data.js"></script>
  <script src="motion.js"></script>
  <script src="experiment-themes.js"></script>   <!-- EXPERIMENT: swatch rail presets -->
  <script src="coreui-markup.js"></script>
  <script src="app.js"></script>
</body>
</html>
